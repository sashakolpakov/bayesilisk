[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesilisk"
version = "1.2.0"
description = "Deterministic local layer for permission, entitlement, route, and data-boundary sitting over Playwright, with Grassmann attention, and LLM-generated scenario-proposal workflows gated by a finite-state verifier."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
docs = ["sphinx>=7", "myst-parser>=2", "furo>=2024.1.29"]
playwright = ["playwright>=1.44"]

[project.scripts]
bayesilisk = "bayesilisk.cli:main"
bayesilisk-demo = "bayesilisk.demo:main"
bayesilisk-realistic-demo = "bayesilisk.realistic_demo:main"
bayesilisk-mcp = "bayesilisk.mcp_server:main"

[tool.setuptools.packages.find]
include = ["bayesilisk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_playwright: requires installed Playwright browsers and runs the browser probe end to end",
    "live_ollama: requires a reachable Ollama server and configured scenario proposer model",
]
