[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesilisk"
version = "1.2.0"
description = "Deterministic local verifier for permission, entitlement, route, and data-boundary scenarios."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
docs = ["sphinx>=7", "myst-parser>=2", "furo>=2024.1.29"]
playwright = ["playwright>=1.44"]

[project.scripts]
bayesilisk = "bayesilisk.bayesilisk:main"
bayesilisk-mcp = "bayesilisk.mcp_server:main"

[tool.setuptools.packages.find]
include = ["bayesilisk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
