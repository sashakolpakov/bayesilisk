[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesilisk"
version = "1.2.0"
description = "Deterministic local layer for permission, entitlement, route, and data-boundary sitting over Playwright, with Grassmann attention, and LLM-generated scenario-proposal workflows gated by a finite-state verifier."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = [
    "mcp",
    "model-context-protocol",
    "playwright",
    "authorization",
    "permissions",
    "security-testing",
    "verifier",
    "connector",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Security",
]

# NOTE: add a LICENSE file and the matching `license`/license classifier before
# publishing to PyPI. Left unset intentionally — the license is the maintainer's
# choice.

[project.urls]
Homepage = "https://github.com/sashakolpakov/bayesilisk"
Repository = "https://github.com/sashakolpakov/bayesilisk"
Documentation = "https://sashakolpakov.github.io/bayesilisk/"
Issues = "https://github.com/sashakolpakov/bayesilisk/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "cryptography>=42"]
docs = ["sphinx>=7", "myst-parser>=2", "furo>=2024.1.29"]
playwright = ["playwright>=1.44"]
premium = ["cryptography>=42"]
scan = ["pyyaml>=6"]

[project.scripts]
bayesilisk = "bayesilisk.cli:main"
bayesilisk-demo = "bayesilisk.demo:main"
bayesilisk-realistic-demo = "bayesilisk.realistic_demo:main"
bayesilisk-mcp = "bayesilisk.mcp_server:main"

[tool.setuptools.packages.find]
include = ["bayesilisk*"]

[tool.setuptools.package-data]
bayesilisk = ["motifs/core/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_playwright: requires installed Playwright browsers and runs the browser probe end to end",
    "live_ollama: requires a reachable Ollama server and configured scenario proposer model",
]
